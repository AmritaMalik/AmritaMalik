<svg width="1200" height="170" viewBox="0 0 1200 170" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#03040c"/>
      <stop offset="50%" stop-color="#160a38"/>
      <stop offset="100%" stop-color="#03040c"/>
    </linearGradient>
    <linearGradient id="fText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#39FF14"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>
    <filter id="fShadow" x="-30%" y="-30%" width="160%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1200" height="170" fill="url(#fBg)"/>
  <rect y="0" width="1200" height="2" fill="url(#fText)" opacity="0.55"/>

  <g filter="url(#fShadow)">
    <rect x="260" y="45" width="680" height="80" rx="18" fill="url(#glassFill)" stroke="#9D4EDD" stroke-opacity="0.4" stroke-width="1.3"/>
  </g>

  <g fill="#39FF14" opacity="0.22" font-family="Fira Code, monospace" font-size="12">
    <text x="40" y="30">while(true){build();}</text>
    <text x="980" y="150">// see you in the next commit</text>
  </g>

  <text x="600" y="95" text-anchor="middle" font-family="Fira Code, monospace" font-weight="600"
        font-size="24" fill="url(#fText)">
    Thanks for stopping by ⚡ — let's build something impactful
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3.5s" repeatCount="indefinite"/>
  </text>
</svg>
