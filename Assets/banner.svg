<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050014"/>
      <stop offset="45%" stop-color="#1a0b3d"/>
      <stop offset="100%" stop-color="#04060f"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39FF14"/>
      <stop offset="55%" stop-color="#B79CED"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7B2CBF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7B2CBF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#39FF14" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#39FF14" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <circle cx="150" cy="60" r="180" fill="url(#glow1)">
    <animate attributeName="cx" values="150;250;150" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="240" r="200" fill="url(#glow2)">
    <animate attributeName="cy" values="240;150;240" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- circuit lines -->
  <g stroke="#9D4EDD" stroke-width="1.4" fill="none" opacity="0.55">
    <path d="M0 40 H120 L150 70 H320" >
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M1200 260 H1080 L1050 230 H900">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="5s" repeatCount="indefinite"/>
    </path>
    <circle cx="320" cy="70" r="4" fill="#39FF14"/>
    <circle cx="900" cy="230" r="4" fill="#00E5FF"/>
  </g>

  <!-- matrix code columns -->
  <g font-family="Fira Code, monospace" font-size="14" fill="#39FF14" opacity="0.28">
    <text x="60" y="30">01 10 AI</text>
    <text x="60" y="270">10 01 ML</text>
    <text x="1100" y="30">CV 01</text>
    <text x="1100" y="270">10 GPU</text>
  </g>

  <text x="600" y="150" text-anchor="middle" font-family="Fira Code, monospace"
        font-weight="700" font-size="58" fill="url(#titleGrad)" filter="url(#softGlow)">
    AMRITA MALIK
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
  </text>

  <text x="600" y="195" text-anchor="middle" font-family="Fira Code, monospace"
        font-size="20" fill="#B79CED" opacity="0.9">
    AI Engineer · Computer Vision · Cloud · Accessible Tech
  </text>

  <rect x="430" y="215" width="340" height="2" fill="url(#titleGrad)" opacity="0.8">
    <animate attributeName="width" values="0;340;340" dur="2s"/>
  </rect>
</svg>
