<svg width="1200" height="160" viewBox="0 0 1200 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#04060f"/>
      <stop offset="50%" stop-color="#1a0b3d"/>
      <stop offset="100%" stop-color="#04060f"/>
    </linearGradient>
    <linearGradient id="fText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#39FF14"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="160" fill="url(#fBg)"/>
  <rect y="0" width="1200" height="2" fill="url(#fText)" opacity="0.6"/>
  <g fill="#39FF14" opacity="0.25" font-family="Fira Code, monospace" font-size="12">
    <text x="40" y="30">while(true){build();}</text>
    <text x="980" y="140">// see you in the next commit</text>
  </g>
  <text x="600" y="95" text-anchor="middle" font-family="Fira Code, monospace" font-weight="600"
        font-size="26" fill="url(#fText)">
    Thanks for stopping by ⚡ — let's build something impactful
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3.5s" repeatCount="indefinite"/>
  </text>
</svg>
