<svg width="360" height="360" viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="hBg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#241a4d"/>
      <stop offset="100%" stop-color="#04060f"/>
    </radialGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0C29"/>
      <stop offset="100%" stop-color="#1a0b3d"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39FF14"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="180" cy="180" r="175" fill="url(#hBg)"/>
  <circle cx="180" cy="180" r="170" fill="none" stroke="#9D4EDD" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- floating particles -->
  <g fill="#39FF14" opacity="0.7">
    <circle cx="60" cy="90" r="3"><animate attributeName="cy" values="90;70;90" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="120" r="2.5"><animate attributeName="cy" values="120;140;120" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="280" r="2"><animate attributeName="cy" values="280;260;280" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="290" cy="260" r="3"><animate attributeName="cy" values="260;280;260" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- laptop base -->
  <rect x="110" y="255" width="140" height="10" rx="3" fill="#2a2450"/>
  <path d="M100 255 L260 255 L250 245 L110 245 Z" fill="#1a1440"/>

  <!-- laptop screen -->
  <rect x="118" y="150" width="124" height="95" rx="6" fill="url(#screenGrad)" stroke="#9D4EDD" stroke-width="2"/>
  <rect x="128" y="160" width="104" height="75" rx="3" fill="#050014"/>

  <!-- code lines on screen -->
  <g stroke="url(#neon)" stroke-width="2.2" stroke-linecap="round" opacity="0.9">
    <line x1="136" y1="170" x2="180" y2="170"/>
    <line x1="136" y1="180" x2="205" y2="180"/>
    <line x1="136" y1="190" x2="165" y2="190"/>
    <line x1="136" y1="200" x2="195" y2="200"/>
    <line x1="136" y1="210" x2="150" y2="210"/>
  </g>

  <!-- neural network hologram above laptop -->
  <g filter="url(#glow)">
    <g stroke="#00E5FF" stroke-width="1.3" opacity="0.7">
      <line x1="150" y1="120" x2="180" y2="90"/>
      <line x1="150" y1="120" x2="180" y2="130"/>
      <line x1="210" y1="120" x2="180" y2="90"/>
      <line x1="210" y1="120" x2="180" y2="130"/>
      <line x1="180" y1="90" x2="180" y2="60"/>
      <line x1="180" y1="130" x2="150" y2="150"/>
      <line x1="180" y1="130" x2="210" y2="150"/>
    </g>
    <g fill="#39FF14">
      <circle cx="150" cy="120" r="5"/>
      <circle cx="210" cy="120" r="5"/>
      <circle cx="180" cy="90" r="5"/>
      <circle cx="180" cy="130" r="5"/>
      <circle cx="180" cy="60" r="6">
        <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="150" cy="150" r="4" fill="#00E5FF"/>
      <circle cx="210" cy="150" r="4" fill="#00E5FF"/>
    </g>
  </g>

  <!-- developer silhouette (abstract, non-identifying) -->
  <g fill="#2a2450" stroke="#7B2CBF" stroke-width="1.5">
    <circle cx="180" cy="300" r="26"/>
    <path d="M140 355 C140 320 160 302 180 302 C200 302 220 320 220 355 Z"/>
  </g>
  <path d="M168 292 Q180 302 192 292" stroke="#39FF14" stroke-width="2" fill="none" opacity="0.8"/>
</svg>
