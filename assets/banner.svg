<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040014"/>
      <stop offset="45%" stop-color="#160a38"/>
      <stop offset="100%" stop-color="#03040c"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39FF14"/>
      <stop offset="55%" stop-color="#B79CED"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7B2CBF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7B2CBF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#39FF14" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="cardBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#39FF14" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <circle cx="150" cy="50" r="190" fill="url(#glow1)">
    <animate attributeName="cx" values="150;260;150" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="250" r="210" fill="url(#glow2)">
    <animate attributeName="cy" values="250;150;250" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- floating glass panel behind the title: perspective via trapezoid + blur + shadow -->
  <g filter="url(#cardShadow)">
    <path d="M260 55 L940 55 L965 235 L235 235 Z"
          fill="url(#glassFill)" stroke="#9D4EDD" stroke-opacity="0.45" stroke-width="1.4" filter="url(#cardBlur)"/>
    <path d="M260 55 L940 55 L936 78 L264 78 Z" fill="#ffffff" opacity="0.10"/>
  </g>
  <!-- glowing top edge of the glass panel -->
  <path d="M270 56 L930 56" stroke="url(#titleGrad)" stroke-width="2" opacity="0.85"/>

  <!-- circuit lines -->
  <g stroke="#9D4EDD" stroke-width="1.4" fill="none" opacity="0.5">
    <path d="M0 40 H120 L150 70 H235"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="4s" repeatCount="indefinite"/></path>
    <path d="M1200 260 H1080 L1050 230 H965"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="5s" repeatCount="indefinite"/></path>
    <circle cx="235" cy="70" r="4" fill="#39FF14"/>
    <circle cx="965" cy="230" r="4" fill="#00E5FF"/>
  </g>

  <g font-family="Fira Code, monospace" font-size="13" fill="#39FF14" opacity="0.25">
    <text x="60" y="30">01 10 AI</text>
    <text x="60" y="278">10 01 ML</text>
    <text x="1105" y="30">CV 01</text>
    <text x="1105" y="278">10 GPU</text>
  </g>

  <text x="600" y="150" text-anchor="middle" font-family="Fira Code, monospace"
        font-weight="700" font-size="56" fill="url(#titleGrad)" filter="url(#softGlow)">
    AMRITA MALIK
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
  </text>

  <text x="600" y="192" text-anchor="middle" font-family="Fira Code, monospace"
        font-size="19" fill="#B79CED" opacity="0.9">
    AI Engineer · Computer Vision · Cloud · Accessible Tech
  </text>

  <rect x="440" y="210" width="320" height="2" fill="url(#titleGrad)" opacity="0.85">
    <animate attributeName="width" values="0;320;320" dur="2s"/>
  </rect>
</svg>
