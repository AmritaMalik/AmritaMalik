<svg width="1200" height="32" viewBox="0 0 1200 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#04060f" stop-opacity="0"/>
      <stop offset="15%" stop-color="#39FF14"/>
      <stop offset="50%" stop-color="#9D4EDD"/>
      <stop offset="85%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#04060f" stop-opacity="0"/>
    </linearGradient>
    <filter id="dGlow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>
  <rect x="0" y="14" width="1200" height="1.5" fill="url(#lineGrad)" filter="url(#dGlow)" opacity="0.7"/>
  <rect x="0" y="15" width="1200" height="1.5" fill="url(#lineGrad)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>
  <circle cx="600" cy="16" r="4" fill="#39FF14" filter="url(#dGlow)">
    <animate attributeName="cx" values="80;1120;80" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>
