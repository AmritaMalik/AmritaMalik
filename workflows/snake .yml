name: Generate Snake Animation

on:
  schedule:
    # Runs every day at 00:00 UTC — keeps the snake in sync with new contributions
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # allows manual trigger from the Actions tab
  push:
    branches:
      - main

# Prevents overlapping runs if a schedule tick and a push land at the same time
concurrency:
  group: snake-generation
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: AmritaMalik
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=39FF14&color_dots=1,B79CED,9D4EDD,7B2CBF,3C096C

      - name: Push generated files to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
